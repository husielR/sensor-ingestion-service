spring.application.name=sensor-ingestion-serviceserver.port=8087# Application Kafka#spring.kafka.bootstrap-servers=localhost:9094spring.kafka.streams.application-id=mqtt-sensor-streamspring.kafka.consumer.auto-offset-reset=latestspring.kafka.topic=${AZURE_EVENTHUB_NAME}# ==========================================# CONFIGURACIÓN MQTT (LOCAL / EXPLICATIVA)# ==========================================value.mqtt.url:tcp://localhost:1883value.mqtt.clientid=testClientvalue.mqtt.topic=topicTest# ==========================================# CONFIGURACIÓN DE BASE DE DATOS (AZURE SQL)# ==========================================spring.datasource.url=jdbc:sqlserver://monitoring-iot-sql.database.windows.net:1433;database=database-monitoringspring.datasource.username=${DB_USER}spring.datasource.password=${DB_PASSWORD}spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver# JPA/Hibernate Configurationspring.jpa.properties.hibernate.dialect=org.hibernate.dialect.SQLServerDialect# ==========================================# CONFIGURACIÓN DE CONEXIÓN DE AZURE (KAFKA API)# ==========================================# Endpoint compatible con Kafka en Azure (Puerto SSL 9093)spring.kafka.bootstrap-servers=${AZURE_EVENTHUBS_NAMESPACE}.servicebus.windows.net:9093# 1. Configuración de Seguridad para el Consumidor/Productor basespring.kafka.properties.security.protocol=SASL_SSLspring.kafka.properties.sasl.mechanism=PLAINspring.kafka.properties.sasl.jaas.config=org.apache.kafka.common.security.plain.PlainLoginModule required username="$ConnectionString" password="${AZURE_EVENTHUBS_CONNECTION_STRING}";# 2. CRÍTICO: Configuración de Seguridad Duplicada EXCLUSIVAMENTE para Kafka Streamsspring.kafka.streams.properties.security.protocol=SASL_SSLspring.kafka.streams.properties.sasl.mechanism=PLAINspring.kafka.streams.properties.sasl.jaas.config=org.apache.kafka.common.security.plain.PlainLoginModule required username="$ConnectionString" password="${AZURE_EVENTHUBS_CONNECTION_STRING}";# 3. RECOMENDADO POR MICROSOFT: Optimización de tiempos para evitar desconexiones de Azurespring.kafka.properties.connections.max.idle.ms=180000spring.kafka.properties.metadata.max.age.ms=180000spring.kafka.streams.properties.connections.max.idle.ms=180000spring.kafka.streams.properties.metadata.max.age.ms=180000